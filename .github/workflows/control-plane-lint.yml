name: ChoreScore Control Plane Lint

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - '!.github/trigger-v4-finalizer'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chorescore-control-plane-lint
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Enforce CI efficiency invariants
        run: bash .github/scripts/validate-ci-efficiency.sh

name: ChoreScore V4 Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/trigger-v4-release'

permissions:
  contents: write
  actions: read

concurrency:
  group: chorescore-v4-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout V4 product
        uses: actions/checkout@v4
        with:
          ref: lab/chorescore-v4
          fetch-depth: 0

      - name: Capture tested SHA
        id: sha
        run: |
          set -euo pipefail
          echo "tested_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cheap trusted gates
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run privacy:check
          npm run cost:check
          npm run i18n:check
          bash -n scripts/boot-emulator.sh
          node --check scripts/e2e-android.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android tooling
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$ANDROID_HOME"
          export ANDROID_HOME ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;default;x86_64" >/dev/null
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          command -v adb
          adb version
          command -v emulator || test -x "$ANDROID_HOME/emulator/emulator"

      - name: Build x86_64 E2E APK once
        env:
          EXPO_PUBLIC_E2E_AUTH: '1'
        run: |
          set -euo pipefail
          rm -rf android
          npx --no-install expo prebuild --platform android --no-install
          (cd android && ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon)
          apk=$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -1)
          test -s "$apk"
          mkdir -p release audit/android-e2e
          cp "$apk" release/chorescore-v4-e2e-x86.apk
          echo "E2E APK: $(stat -c%s release/chorescore-v4-e2e-x86.apk) bytes"

      - name: Android API 35 golden path — at most two infra attempts
        env:
          API_LEVEL: '35'
          ARCH: x86_64
          TARGET: default
          PROFILE: pixel_6
          EMULATOR_PORT: '5554'
          EMULATOR_BOOT_TIMEOUT: '420'
          CHORESCORE_APK_PATH: ${{ github.workspace }}/release/chorescore-v4-e2e-x86.apk
          CHORESCORE_E2E_OUTPUT: ${{ github.workspace }}/audit/android-e2e
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          command -v adb
          adb version >/dev/null

          passed=0
          for attempt in 1 2; do
            echo "=== Android release attempt $attempt/2 ==="
            rm -rf "audit/android-e2e/attempt-$attempt"
            mkdir -p "audit/android-e2e/attempt-$attempt"
            export CHORESCORE_E2E_OUTPUT="$GITHUB_WORKSPACE/audit/android-e2e/attempt-$attempt"

            adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
            adb -s 127.0.0.1:5555 emu kill >/dev/null 2>&1 || true
            pkill -f 'qemu-system.*chorescore_v4' >/dev/null 2>&1 || true
            pkill -f 'emulator.*chorescore_v4' >/dev/null 2>&1 || true
            sleep 2

            boot_log="$RUNNER_TEMP/v4-boot-$attempt.log"
            set +e
            bash scripts/boot-emulator.sh > >(tee "$boot_log") 2>&1
            boot_rc=$?
            set -e
            cp "$boot_log" "audit/android-e2e/attempt-$attempt/boot.log" || true

            if (( boot_rc != 0 )); then
              echo "Infrastructure boot failure on attempt $attempt."
              if (( attempt == 1 )); then continue; fi
              exit "$boot_rc"
            fi

            serial=emulator-5554
            if ! timeout 10 adb -s "$serial" get-state 2>/dev/null | grep -q '^device$'; then
              adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
              if timeout 10 adb -s 127.0.0.1:5555 get-state 2>/dev/null | grep -q '^device$'; then
                serial=127.0.0.1:5555
              else
                echo "No live adb transport after successful boot."
                if (( attempt == 1 )); then continue; fi
                exit 31
              fi
            fi
            export ANDROID_SERIAL="$serial"
            echo "Golden path device: $ANDROID_SERIAL"

            set +e
            npm run e2e:android > >(tee "audit/android-e2e/attempt-$attempt/e2e.log") 2>&1
            e2e_rc=$?
            set -e

            if (( e2e_rc == 0 )); then
              passed=1
              echo "V4 golden path passed on attempt $attempt."
              break
            fi

            log="audit/android-e2e/attempt-$attempt/e2e.log"
            if grep -Eqi 'No adb device|device offline|device not found|no devices|Broken pipe|Failure calling service|ETIMEDOUT|adb .*failed|emulator.*(failed|ERROR)' "$log"; then
              echo "Classified as Android/ADB infrastructure failure."
              if (( attempt == 1 )); then continue; fi
            else
              echo "Product golden-path failure — no blind retry."
              exit "$e2e_rc"
            fi
          done

          (( passed == 1 )) || { echo "Android golden path failed after two bounded infra attempts."; exit 32; }

      - name: Production export gates
        env:
          EXPO_PUBLIC_E2E_AUTH: ''
        run: |
          set -euo pipefail
          unset EXPO_PUBLIC_E2E_AUTH
          rm -rf .expo dist
          npx --no-install expo export --platform android --output-dir "$RUNNER_TEMP/v4-final-android-export"
          npx --no-install expo export --platform ios --output-dir "$RUNNER_TEMP/v4-final-ios-export"

      - name: Build clean arm64-v8a production APK
        env:
          EXPO_PUBLIC_E2E_AUTH: ''
        run: |
          set -euo pipefail
          unset EXPO_PUBLIC_E2E_AUTH
          rm -rf android
          rm -rf node_modules/.cache/metro
          rm -rf "${TMPDIR:-/tmp}"/metro-* "${TMPDIR:-/tmp}"/haste-map-* 2>/dev/null || true
          npx --no-install expo prebuild --platform android --no-install
          (cd android && env -u EXPO_PUBLIC_E2E_AUTH ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon)
          apk=$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -1)
          test -s "$apk"
          mkdir -p release
          cp "$apk" release/ChoreScore-v4-arm64-release.apk
          sha256sum release/ChoreScore-v4-arm64-release.apk | tee release/SHA256.txt
          test "$(stat -c%s release/ChoreScore-v4-arm64-release.apk)" -gt 1000000

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: chorescore-v4-android-release
          path: |
            release/ChoreScore-v4-arm64-release.apk
            release/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attest exact tested V4 release
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.sha.outputs.tested_sha }}
        run: |
          set -euo pipefail
          apksha=$(awk '{print $1}' release/SHA256.txt)
          git fetch origin +refs/heads/lab/chorescore-v4:refs/remotes/origin/lab/chorescore-v4
          remote=$(git rev-parse refs/remotes/origin/lab/chorescore-v4)
          [[ "$remote" == "$TESTED_SHA" ]] || {
            echo "::error::V4 branch advanced from tested SHA $TESTED_SHA to $remote; refusing stale attestation."
            exit 75
          }

          tmp=$(mktemp)
          jq --arg run "${{ github.run_id }}" --arg apk "$apksha" --arg tested "$TESTED_SHA" '
            (.criteria[] | select(.id=="V4-09") | .status)="complete" |
            (.criteria[] | select(.id=="V4-09") | .evidence) += [
              "single-release-run-"+$run,
              "tested-v4-sha-"+$tested,
              "android-api35-golden-path-green",
              "clean-production-arm64",
              "android-release-apk-sha256-"+$apk,
              "ios-export-readiness-green",
              "privacy-cost-i18n-gates-green"
            ] |
            .pendingArtifact=null |
            .activeCriteria=[] |
            .openFindings=[] |
            .lastCycle=$run |
            .progressSummary="V4 RC complete: one trusted release workflow passed deterministic gates, Android API35 golden path, clean production arm64 build and iOS export readiness." |
            .factoryHealth.stalled=false |
            .factoryHealth.consecutiveNoProgress=0 |
            .factoryHealth.releaseInfraRetries=0 |
            .factoryHealth.reason=null
          ' docs/RELEASE_STATUS.json > "$tmp"
          mv "$tmp" docs/RELEASE_STATUS.json

          tmp=$(mktemp)
          jq '.builder.enabled=false | .builder.criterionId=null | .builder.objective="V4 RC complete." | .builder.scope="No further Builder work." | .builder.acceptance=[]' directives/TASKS.json > "$tmp"
          mv "$tmp" directives/TASKS.json

          git config user.name chorescore-v4-release
          git config user.email chorescore-v4-release@users.noreply.github.com
          git add docs/RELEASE_STATUS.json directives/TASKS.json
          git commit -m "release ${{ github.run_id }}: attest ChoreScore V4 RC"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/lab/chorescore-v4

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chorescore-v4-release-diagnostics
          path: |
            audit/android-e2e/**
            release/chorescore-v4-e2e-x86.apk
          if-no-files-found: ignore
          retention-days: 14
